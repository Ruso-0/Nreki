name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck:tests
      - run: npm run build
      - name: Tests
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=test-results.json
      # Failed tests become annotations, readable from the run page and the
      # check-runs API without signing in (job logs need admin rights).
      - name: Report failed tests
        if: always()
        run: node scripts/ci-test-report.mjs test-results.json
